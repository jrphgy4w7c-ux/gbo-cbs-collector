name: Front Office OS

on:
  push:
    paths:
      - "front_office/**"
      - "gfo/availability.py"
      - ".github/workflows/front-office-os.yml"
  pull_request:
    paths:
      - "front_office/**"
      - "gfo/availability.py"
      - ".github/workflows/front-office-os.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shared doctrine, runtime contract and sport adapters
        run: |
          python3 front_office/validate.py
          python3 gfo/availability.py --self-test
