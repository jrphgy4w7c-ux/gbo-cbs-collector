name: GFO Refresh Provenance

on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * *'
  push:
    branches:
      - main
    paths:
      - gfo/collector.py
      - .github/workflows/gfo-refresh.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: gfo-refresh-provenance
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Regression tests
        run: python gfo/collector.py --self-test

      - name: Restore prior GFO snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p previous
          PREV_RUN_ID=$(gh run list \
            --workflow gfo-refresh.yml \
            --branch main \
            --status success \
            --limit 10 \
            --json databaseId \
            --jq '.[].databaseId' | grep -v "^${GITHUB_RUN_ID}$" | head -1 || true)
          if [ -n "$PREV_RUN_ID" ]; then
            gh run download "$PREV_RUN_ID" -n gfo-refresh-provenance -D previous || true
          fi
          if [ -f previous/latest_snapshot.json ]; then
            echo "PRIOR_ARG=--prior-snapshot previous/latest_snapshot.json" >> "$GITHUB_ENV"
          else
            echo "PRIOR_ARG=" >> "$GITHUB_ENV"
          fi

      - name: Collect and reconcile Sleeper
        shell: bash
        run: |
          python gfo/collector.py \
            --output-dir gfo_refresh \
            --min-round 0 \
            --max-round 18 \
            --require-provenance \
            $PRIOR_ARG

      - name: Upload canonical GFO Refresh
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gfo-refresh-provenance
          path: gfo_refresh/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GREEN marker
        if: success()
        shell: bash
        run: git push --force origin HEAD:refs/heads/gfo-green
